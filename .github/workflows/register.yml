name: Register Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to register or component to bump
        required: true
        default: "0.2.1"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/RegisterAction@v0.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
