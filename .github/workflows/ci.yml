name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        julia-version: ["1.10", "1.11", "1.12"]
        threads: ["1", "4"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      # Run the standard package-test mechanism with real thread control. The
      # environment variables set the actual Julia thread count and let
      # test/concurrency.jl assert `Threads.nthreads()` matches the matrix
      # axis, so the 1/4-thread legs reflect real runtime thread counts.
      # A temporary dev environment avoids coupling the Julia 1.10/1.11 jobs
      # to the checked-in development Manifest generated by Julia 1.12.
      - name: Test (verify thread count)
        run: |
          julia --startup-file=no -e '
            import Pkg
            Pkg.activate(; temp=true)
            Pkg.develop(path=pwd())
            Pkg.test(
                "BigFloatLinearAlgebra";
                julia_args=["--check-bounds=yes", "--depwarn=yes"],
            )
          '
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
          EXPECTED_JULIA_THREADS: ${{ matrix.threads }}

  linearsolve-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - linearsolve_version: "3.87.0"
            scimlbase_version: "2.148.0"
          - linearsolve_version: "4.3.0"
            scimlbase_version: "3.33.0"
          - linearsolve_version: "5"
            scimlbase_version: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - name: Test LinearSolve extension compatibility
        env:
          LINEARSOLVE_VERSION: ${{ matrix.linearsolve_version }}
          SCIMLBASE_VERSION: ${{ matrix.scimlbase_version }}
        run: |
          julia --startup-file=no -e '
            import Pkg
            Pkg.activate(; temp=true)
            Pkg.develop(path=pwd())
            Pkg.add([
                Pkg.PackageSpec(name="LinearSolve", version=ENV["LINEARSOLVE_VERSION"]),
                Pkg.PackageSpec(name="SciMLBase", version=ENV["SCIMLBASE_VERSION"]),
                Pkg.PackageSpec(name="MutableArithmetics"),
            ])
            include(joinpath(pwd(), "test", "test_utils.jl"))
            include(joinpath(pwd(), "test", "linearsolve_ext.jl"))
          '

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - name: Build and check docs
        run: |
          julia --startup-file=no --project=docs -e '
            import Pkg
            Pkg.develop(path=".")
            Pkg.instantiate()
            include("docs/make.jl")
          '
