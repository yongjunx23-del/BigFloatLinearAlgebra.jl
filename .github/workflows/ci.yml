name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.11", "1.12"]
        threads: ["1", "4"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # Run the standard package-test mechanism with real thread control. The
      # environment variables set the actual Julia thread count and let
      # test/concurrency.jl assert `Threads.nthreads()` matches the matrix
      # axis, so the 1/4-thread legs reflect real runtime thread counts.
      # `--check-bounds=yes --depwarn=yes` preserves the package-test quality
      # gates that julia-runtest used to supply.
      - name: Test (verify thread count)
        run: |
          julia --project=. -e 'import Pkg; Pkg.test(; julia_args=["--check-bounds=yes", "--depwarn=yes"])'
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
          EXPECTED_JULIA_THREADS: ${{ matrix.threads }}
