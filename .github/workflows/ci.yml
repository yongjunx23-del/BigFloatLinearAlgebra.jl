name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.11", "1.12"]
        threads: ["1", "4"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # Run tests directly with an explicit `--threads` flag so the thread
      # count is real. `EXPECTED_JULIA_THREADS` lets test/concurrency.jl assert
      # `Threads.nthreads()` matches the matrix axis instead of trusting the
      # axis name alone.
      - name: Test (verify thread count)
        run: julia --project=. --threads=${{ matrix.threads }} test/runtests.jl
        env:
          EXPECTED_JULIA_THREADS: ${{ matrix.threads }}
